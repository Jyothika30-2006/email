name: Calibration / forensic question
description: A verdict, threshold, weight, ceiling or evidence claim you think is wrong
labels: ["calibration"]
body:
  - type: markdown
    attributes:
      value: |
        This is the issue type for "the number is wrong", as opposed to "the code crashed". Every
        threshold in this project is a choice with a reason written down, so the useful question is
        *which reason do you reject* — start from `docs/FORENSIC_METHODOLOGY.md` §5 (score fusion:
        thresholds, weights, provenance and caps) and §2 (the webmail origin ladder and its ceilings).

        Redact everything. If you cannot share the mail, share the shape: what passed authentication,
        what the hop chain looked like, what the origin resolution returned.

  - type: textarea
    id: case
    attributes:
      label: The case, as far as you can describe it
      description: |
        Paste the relevant part of `runs/<case>/run.json` — `verdict.evidence`, `verdict.gaps`,
        `signals`, `origin` — rather than the email itself. Those sections exist so this conversation
        can happen without raw mail.
      render: json
    validations:
      required: true

  - type: dropdown
    id: knob
    attributes:
      label: Which knob are you arguing with?
      options:
        - a factor weight in risk.FACTOR_WEIGHTS
        - the SUSPICIOUS floor (30) or the MALICIOUS threshold (65)
        - the "one strong indicator" requirement
        - an origin source ceiling (received hop / SPF client-ip / lure infra / Message-ID rDNS)
        - a provenance multiplier or a confidence cap (35 / 58 / 68)
        - evidence coverage or corroboration math
        - a header-parsing rule (hops, client-ip=, Date offset, Message-ID)
        - something else
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: What should have happened, and why
      description: |
        Be specific about the mechanism: "homoglyph + SPF fail + a bare-IP link should reach
        MALICIOUS even with mitigators" is an argument; "it felt too low" is not.
    validations:
      required: true

  - type: textarea
    id: harm
    attributes:
      label: Which failure mode does your proposal make worse?
      description: |
        Every change here trades false positives against false negatives, and this project's
        position is that crying wolf is expensive too. If you lower a threshold, say what you are
        willing to over-flag.
    validations:
      required: true

  - type: checkboxes
    id: honesty
    attributes:
      label: Constraints I accept if this is merged
      options:
        - label: "The verdict is produced by `risk.fuse() + classify()`, not by the model, and stays that way"
          required: true
        - label: "Any threshold or weight change ships with an end-to-end expectation for all four samples"
          required: true
        - label: "A mitigator may lower confidence, but never reduce risk to zero or launder a case"
          required: true
        - label: "The report must still name every gap as `unobserved` rather than implying a clean bill"
          required: true
