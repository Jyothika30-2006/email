name: CI

# What this gate protects: the four claims in the README that are measurements, not
# intentions — the tool count, the exit-code contract, the fail-closed gate, and the fact
# that the whole suite runs offline. Everything below is checked from a clean checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The fixture file is the whole DNS universe in CI (see config/default.env.example).
  # One keyless DNSBL that answers sometimes and not always is the only way two runs of
  # the same sample can differ, so it is switched off before anything else happens.
  SENTINEL_DNS_STRICT: "1"

jobs:
  test:
    name: suite · selftest · demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install (two runtime deps, that is the whole list)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: selftest — safety invariants, no case file required
        shell: bash
        run: |
          set +e
          python -m cybersecurity_agent selftest 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 24 "$RUNNER_TEMP/selftest.log" | sed 's/%/%25/g' | paste -sd '%0A' -)
            printf '::error::selftest failed (exit %s): %s\n' "$rc" "$msg"
          fi
          exit "$rc"

      # `-o addopts=""` matters: pyproject already passes -q, and `-q -q` collapses the whole
      # summary to dots — the worst possible thing for a failing run to print. The ::error:: lines
      # put the failing test names into the check annotations, readable without log access.
      # The proxies are the point of this step: GitHub runners *do* have internet, this suite must
      # not notice. Every HTTP request goes to a port nothing listens on; 127.0.0.1 (where the
      # tests' own mock server lives) stays direct.
      - name: pytest — offline, no network egress needed
        shell: bash
        run: |
          export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=$http_proxy HTTPS_PROXY=$https_proxy
          export no_proxy=127.0.0.1,localhost,::1 NO_PROXY=$no_proxy
          set +e
          python -m pytest tests -o addopts="" -q --color=no --tb=short 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" "$RUNNER_TEMP/pytest.log" | head -n 12 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            tail -n 4 "$RUNNER_TEMP/pytest.log" | while IFS= read -r line; do
              printf '::notice::%s\n' "${line//%/%25}"
            done
          fi
          exit "$rc"

      - name: guided demo — the four samples, the gate, the parity check
        shell: bash
        run: |
          set -o pipefail
          export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=$http_proxy HTTPS_PROXY=$https_proxy
          export no_proxy=127.0.0.1,localhost,::1 NO_PROXY=$no_proxy
          bash scripts/demo.sh --quick 2>&1 | tee "$RUNNER_TEMP/demo.log"

      # The demo is a script of assertions, so say which assertion failed in the annotations too.
      - name: which claim broke
        if: failure()
        shell: bash
        run: |
          grep -E "✗|FAILURES|Traceback|Error:" "$RUNNER_TEMP/demo.log" | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//%/%25}"
          done || true

      # Deliberately NOT uploading runs/ or evidence/: a case directory is somebody's
      # mail, and this project's own rule is that evidence stays on the analyst's disk.
      # The transcript is enough to debug a red check.
      - name: demo transcript (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-log-${{ matrix.python-version }}
          path: ${{ runner.temp }}/demo.log
          if-no-files-found: ignore

  # The suite's promise is that it runs on `rich` + `dnspython` + pytest and nothing else, and
  # that the optional extras are real. Both halves need a job: `test` proves the first (it would
  # have died here if an optional import were mandatory), this one proves the second.
  chain-extras:
    name: optional '.[chain]' extra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTINEL_DNS_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install with the optional crypto extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,chain]"
      # Same no-egress rule as the main job, so "it passes with the extras installed" means the
      # same thing as "it passes offline".
      - name: tests that skip without pycryptodome must pass with it
        shell: bash
        run: |
          export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=$http_proxy HTTPS_PROXY=$https_proxy
          export no_proxy=127.0.0.1,localhost,::1 NO_PROXY=$no_proxy
          python -m pytest tests/test_ganache_logger.py -o addopts="" -q --color=no --tb=short
      - name: and the suite must agree with itself either way
        shell: bash
        run: |
          export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=$http_proxy HTTPS_PROXY=$https_proxy
          export no_proxy=127.0.0.1,localhost,::1 NO_PROXY=$no_proxy
          python -m pytest tests -o addopts="" -q --color=no --tb=short

  quality:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ruff
        run: pip install "ruff>=0.6"

      # The part that actually breaks runs: a name that does not exist, a duplicate
      # definition, a syntax error. This one gates the merge.
      - name: correctness gate
        run: ruff check cybersecurity_agent tests --select F821,F811,E9 --output-format=github

      # Formatting/imports/typing-style findings are reported but do not block, because
      # the repo has not been reformatted to them yet. Turn the continue-on-error off the
      # day `ruff check --fix` is merged clean.
      - name: style dashboard (advisory)
        continue-on-error: true
        run: ruff check cybersecurity_agent tests --statistics

      - name: diagrams and docs are consistent with the code
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
          python -m pytest tests/test_docs_are_honest.py -q --color=yes

      # The gate that found two real bugs before anyone thought to look for them.
      - name: ruff version used
        run: ruff --version
